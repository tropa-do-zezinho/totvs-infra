name: Azure OIDC check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prod/**"
      - ".github/workflows/azure-oidc-check.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
      - name: Initialize remote Terraform backend
        run: terraform -chdir=prod init -input=false
      - name: Plan without creating resources
        run: terraform -chdir=prod plan -input=false -no-color -lock-timeout=5m
